<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuzinho hoje? ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">UMA PERGUNTINHA IMPORTANTE...</div>
      <div class="heart">♡</div>
      <h1>Cuzinho <span>hoje?</span></h1>
      <p class="subtitle">responda com sinceridade.<br>eu prometo aceitar a resposta... talvez. ♡</p>

      <div class="buttons">
        <button id="yes" class="yes" type="button">SIM <span>♡</span></button>
      </div>

      <div class="hint" id="hint">escolha com carinho ♡</div>
    </section>
  </main>

  <!-- Fica FORA do card de propósito: evita clipping/containing block do backdrop-filter. -->
  <button id="no" class="no runaway-no" type="button" aria-label="Não">NÃO</button>

  <script src="script.js"></script>
</body>
</html>
